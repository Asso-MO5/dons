<div class="grid grid-rows-[auto_1fr] gap-3 bg-sl-bg h-dvh" id="page">

  <main class="flex flex-col gap-4 p-10 mb-3 relative h-full">
    <div class="absolute inset-0 overflow-y-auto p-6">
      <header class="mb-5">
        <h1 data-trans="membership_page_title" class="text-center text-3xl uppercase"></h1>
        <div data-trans="membership_page_desc" class="text-center text-sl-primary max-w-2xl mx-auto mt-3"></div>
      </header>

      <section class="max-w-lg mx-auto">
        <form id="membership_form"
          class="flex flex-col gap-3 sm:grid sm:grid-cols-2 p-3 max-w-lg mx-auto overflow-y-auto"
          _="on submit halt the event">

          <fieldset>
            <label required for="membership_name" data-trans="name"></label>
            <input type="text" required id="membership_name" name="name">
          </fieldset>
          <fieldset>
            <label required for="membership_lastname" data-trans="lastname"></label>
            <input type="text" required id="membership_lastname" name="lastname">
          </fieldset>
          <fieldset class="col-span-2">
            <label required for="membership_email" data-trans="email"></label>
            <input type="email" required id="membership_email" name="email">
          </fieldset>
          <fieldset class="col-span-2">
            <label for="membership_discord" data-trans="discord_pseudo"></label>
            <input type="text" id="membership_discord" name="discord_pseudo">
          </fieldset>
          <fieldset class="col-span-2">
            <label required for="membership_address" data-trans="address"></label>
            <input type="text" id="membership_address" name="address" required>
          </fieldset>
          <fieldset>
            <label required for="membership_postal_code" data-trans="postal_code"></label>
            <input type="text" id="membership_postal_code" name="postal_code" required _="
                on change
                if me.value
                toggle .opacity-50 on #membership_city
                set #membership_city.value to '...'
                call app.helpers.getBano(me.value)
                then
                if result.length > 0
                then log result[0] set #membership_city.value to result[0].city
                toggle .opacity-50 on #membership_city
                end
            ">
          </fieldset>
          <fieldset>
            <label required for="membership_city" data-trans="city"></label>
            <input type="text" id="membership_city" name="city" required>
          </fieldset>

          <fieldset class="col-span-2 membership-renewal-fieldset">
            <input type="checkbox" id="membership_renewal" name="renewal" value="1" class="membership-renewal-checkbox">
            <label for="membership_renewal" data-trans="membership_renewal" class="font-bold cursor-pointer"></label>
          </fieldset>

          <div id="membership_paypal-buttons" class="flex col-span-2 mt-4"></div>
        </form>
      </section>
    </div>
  </main>

</div>

<span _="
  on load
  call app.helpers.injectTemplate('header') then put result at the start of #page
  call app.helpers.loadMembershipModal()
  call app.helpers.translate()
  " class="fixed">
</span>
