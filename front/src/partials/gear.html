<div class="grid grid-rows-[auto_1fr] gap-3 bg-sl-bg h-dvh" id="page">

  <main class="flex flex-col gap-4 p-10 mb-3 relative h-full">
    <div class="absolute inset-0 overflow-y-auto p-6">
      <header class="max-w-lg mx-auto">
        <h1 class="text-center" data-trans="gear_title"></h1>
        <div class="text-center italic text-sm" data-trans="gear_desc"></div>
      </header>

      <form class="flex flex-col gap-3 sm:grid sm:grid-cols-2 p-3 max-w-lg mx-auto overflow-y-auto"
        _="on submit halt the event then call app.helpers.submitGear(me)">
        <fieldset>
          <label for="gear_name" data-trans="name"></label>
          <input type="text" required id="gear_name" name="name">
        </fieldset>
        <fieldset>
          <label for="gear_lastname" data-trans="lastname"></label>
          <input type="text" required id="gear_lastname" name="lastname">
        </fieldset>
        <fieldset>
          <label for="gear_email" data-trans="email"></label>
          <input type="email" required id="gear_email" name="email">
        </fieldset>
        <fieldset>
          <label for="gear_tel" data-trans="phone"></label>
          <input type="tel" id="gear_tel" name="tel">
        </fieldset>
        <fieldset class="col-span-2">
          <label for="gear_address" data-trans="address"></label>
          <input type="text" id="gear_address" name="address" required>
        </fieldset>
        <fieldset>
          <label for="gear_postal_code" data-trans="postal_code"></label>
          <input type="text" id="gear_postal_code" name="postal_code" required _="
              on change
              if me.value
              toggle .opacity-50 on #gear_city
              set #gear_city.value to '...'
              call app.helpers.getBano(me.value)
              then
              if result.length > 0
              then log result[0] set #gear_city.value to result[0].city
              toggle .opacity-50 on #gear_city
              end
          ">
        </fieldset>
        <fieldset>
          <label for="gear_city" data-trans="city"></label>
          <input type="text" id="gear_city" name="city" required>
        </fieldset>
        <fieldset class="col-span-2">
          <label for="gear_message" data-trans="message"></label>
          <textarea name="message" id="gear_message" rows="10" class="w-full p-2" placeholder="message" required></textarea>
        </fieldset>
        <fieldset class="col-span-2">
          <label for="gear_files" data-trans="files"></label>
          <input type="file" id="gear_files" name="files" multiple>
        </fieldset>
        <button class="btn col-span-2" data-trans="send"></button>
        <div class="col-span-2 flex justify-center">
          <a href="/" class="btn" data-trans="back_to_donation"></a>
        </div>
      </form>
    </div>
  </main>

</div>

<span _="
  on load
  call app.helpers.injectTemplate('header') then put result at the start of #page
  call app.helpers.translate()
  " class="fixed">
</span>
